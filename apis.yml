aid: ohmconnect
name: Ohmconnect
description: >-
  OhmConnect is a residential demand-response and virtual power plant company
  that turns household electricity flexibility into grid capacity. It alerts
  customers during "OhmHours" — windows when grid power is most expensive or
  carbon-intensive — and pays them cash, gift cards, and prizes for reducing or
  automating down their usage, then aggregates those reductions and sells them
  into wholesale energy markets. It serves California utility customers (PG&E,
  SCE, and SDG&E) and operates as a competitive retail electricity provider in
  Texas through OhmConnect Energy. OhmConnect runs a login-gated developer
  portal (developer.ohmconnect.com) secured with AWS Cognito OAuth2, but
  publishes no public API specification.
